# Local dev instance – test bed for the heating reference case (SPEC §9).
# Helpers only, no real devices.
# Explicit component list instead of default_config: several default
# components (usb, dhcp, ffmpeg, ...) do not work on native Windows.
config:
frontend:
history:
logbook:
system_log:
calendar:

homeassistant:
  name: Zeitwerk Dev
  time_zone: Europe/Berlin
  country: DE
  unit_system: metric
  latitude: 50.11
  longitude: 8.68

logger:
  default: info
  logs:
    custom_components.zeitwerk: debug

# Set-points read by the (simulated) thermostat logic
input_number:
  temperaturspeicher_wohnzimmer:
    name: Temperaturspeicher Wohnzimmer
    min: 5
    max: 30
    step: 0.5
    unit_of_measurement: "°C"
    mode: slider
    icon: mdi:thermometer
  temperaturspeicher_schlafzimmer:
    name: Temperaturspeicher Schlafzimmer
    min: 5
    max: 30
    step: 0.5
    unit_of_measurement: "°C"
    mode: slider
    icon: mdi:thermometer
  temperaturspeicher_bad:
    name: Temperaturspeicher Bad
    min: 5
    max: 30
    step: 0.5
    unit_of_measurement: "°C"
    mode: slider
    icon: mdi:thermometer
  temperaturspeicher_kueche:
    name: Temperaturspeicher Küche
    min: 5
    max: 30
    step: 0.5
    unit_of_measurement: "°C"
    mode: slider
    icon: mdi:thermometer
  temperaturspeicher_buero:
    name: Temperaturspeicher Büro
    min: 5
    max: 30
    step: 0.5
    unit_of_measurement: "°C"
    mode: slider
    icon: mdi:thermometer

input_boolean:
  urlaub:
    name: Urlaub
    icon: mdi:airplane
  heizperiode:
    name: Heizperiode
    icon: mdi:radiator
    initial: true
  # Stand-ins for two persons (geofencing)
  person_1_home:
    name: Person 1 zu Hause
    icon: mdi:account
    initial: true
  person_2_home:
    name: Person 2 zu Hause
    icon: mdi:account-outline
    initial: true

# Holiday source for Hesse: add via UI once
#   Settings → Devices & services → Add integration → "Holiday" (Germany, Hesse)
#   and/or "Workday" (Germany, province HE).
