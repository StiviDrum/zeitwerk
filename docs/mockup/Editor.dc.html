<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Zeitwerk – Block bearbeiten</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#08080a}
a{color:#f5f5f7;text-decoration:none}a:hover{color:#ffffff}
button{font-family:inherit}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0b0b0d; color: #f5f5f7; font-family: Figtree, system-ui, sans-serif">

  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 16px; display: flex; flex-direction: column; gap: 8px; opacity: 0.35">
    <div style="height: 64px; border-radius: 32px; background: #19191d"></div>
    <div style="height: 48px; border-radius: 24px; background: rgba(255,255,255,0.06)"></div>
    <div style="height: 48px; border-radius: 24px; background: rgba(255,255,255,0.06)"></div>
    <div style="height: 30px; border-radius: 10px; background: rgba(111,168,255,0.16); margin-top: 16px"></div>
    <div style="height: 30px; border-radius: 10px; background: rgba(111,168,255,0.16)"></div>
    <div style="height: 30px; border-radius: 10px; background: rgba(111,168,255,0.16)"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.55)"></div>

  <div role="dialog" aria-label="Block bearbeiten" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 18px 24px; border-radius: 28px 28px 0 0; background: #121215; border-top: 1px solid rgba(255,255,255,0.12); display: flex; flex-direction: column; gap: 18px">
    <div style="width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.25); align-self: center"></div>

    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 20px; font-weight: 700">Block bearbeiten</span>
        <span style="font-size: 13px; color: rgba(245,245,247,0.68)">Heizung Wohnzimmer · Werktag (Mo–Fr)</span>
      </div>
      <a href="Main.dc.html" aria-label="Schließen" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600; color: rgba(245,245,247,0.68)">Profil</span>
      <div style="display: flex; gap: 8px">
        <sc-for list="{{profiles}}" as="p" hint-placeholder-count="3">
          <button aria-pressed="{{p.pressed}}" onClick="{{p.pick}}" style="flex: 1; height: 64px; border-radius: 20px; border: 2px solid {{p.border}}; background: {{p.bg}}; color: #f5f5f7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer">
            <span style="width: 12px; height: 12px; border-radius: 6px; background: {{p.color}}; display: block"></span>
            <span style="font-size: 13px; font-weight: 600">{{p.name}}</span>
            <span style="font-size: 11px; color: rgba(245,245,247,0.62)">{{p.value}}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; gap: 10px">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; font-weight: 600; color: rgba(245,245,247,0.68)">Beginn</span>
        <div style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 4px; border-radius: 26px; background: rgba(255,255,255,0.06)">
          <button aria-label="Beginn 15 Minuten früher" onClick="{{startDown}}" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(255,255,255,0.08); color: #f5f5f7; font-size: 20px; cursor: pointer">−</button>
          <span style="font-size: 18px; font-weight: 700">{{startTxt}}</span>
          <button aria-label="Beginn 15 Minuten später" onClick="{{startUp}}" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(255,255,255,0.08); color: #f5f5f7; font-size: 20px; cursor: pointer">+</button>
        </div>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; font-weight: 600; color: rgba(245,245,247,0.68)">Ende</span>
        <div style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 4px; border-radius: 26px; background: rgba(255,255,255,0.06)">
          <button aria-label="Ende 15 Minuten früher" onClick="{{endDown}}" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(255,255,255,0.08); color: #f5f5f7; font-size: 20px; cursor: pointer">−</button>
          <span style="font-size: 18px; font-weight: 700">{{endTxt}}</span>
          <button aria-label="Ende 15 Minuten später" onClick="{{endUp}}" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(255,255,255,0.08); color: #f5f5f7; font-size: 20px; cursor: pointer">+</button>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="position: relative; height: 36px; border-radius: 12px; background: rgba(111,168,255,0.16)">
        <div style="position: absolute; top: 0; bottom: 0; left: {{barLeft}}; width: {{barWidth}}; border-radius: 12px; background: {{barColor}}">
          <span aria-hidden="true" style="position: absolute; left: -5px; top: 6px; bottom: 6px; width: 10px; border-radius: 5px; background: #f5f5f7; box-shadow: 0 0 0 2px #121215; display: block"></span>
          <span aria-hidden="true" style="position: absolute; right: -5px; top: 6px; bottom: 6px; width: 10px; border-radius: 5px; background: #f5f5f7; box-shadow: 0 0 0 2px #121215; display: block"></span>
        </div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 11px; color: rgba(245,245,247,0.62)">
        <span>0</span><span>6</span><span>12</span><span>18</span><span>24</span>
      </div>
      <span style="font-size: 12px; color: rgba(245,245,247,0.68)">Dauer {{durTxt}} · außerhalb gilt Absenkung (Standard)</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600; color: rgba(245,245,247,0.68)">Auch übernehmen für</span>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.18); background: transparent; color: #f5f5f7; font-size: 13px; cursor: pointer">Wochenende</button>
        <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.18); background: transparent; color: #f5f5f7; font-size: 13px; cursor: pointer">Feiertag</button>
      </div>
    </div>

    <div style="display: flex; gap: 10px; margin-top: 4px">
      <a href="Main.dc.html" style="flex: 1; height: 52px; border-radius: 26px; border: 1px solid rgba(255,90,110,0.55); color: #ff8a98; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center">Löschen</a>
      <a href="Main.dc.html" style="flex: 2; height: 52px; border-radius: 26px; background: #f5f5f7; color: #0b0b0d; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">Speichern</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { start: 64, end: 88, profile: 'comfort' };
  }
  renderVals() {
    var self = this;
    var s = this.state;
    var fmt = function (q) {
      var h = Math.floor(q / 4), m = (q % 4) * 15;
      return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
    };
    var defs = [
      { id: 'comfort', name: 'Komfort', value: '22 °C', color: '#ff8b4a', tint: 'rgba(255,139,74,0.14)' },
      { id: 'eco', name: 'Absenkung', value: '18 °C', color: '#6fa8ff', tint: 'rgba(111,168,255,0.14)' },
      { id: 'away', name: 'Abwesend', value: '16 °C', color: '#aeaeb8', tint: 'rgba(174,174,184,0.14)' }
    ];
    var current = defs[0];
    var profiles = defs.map(function (p) {
      var on = p.id === s.profile;
      if (on) current = p;
      return {
        name: p.name, value: p.value, color: p.color,
        pressed: on ? 'true' : 'false',
        border: on ? p.color : 'rgba(255,255,255,0.10)',
        bg: on ? p.tint : 'rgba(255,255,255,0.04)',
        pick: function () { self.setState({ profile: p.id }); }
      };
    });
    var dur = s.end - s.start;
    var dh = Math.floor(dur / 4), dm = (dur % 4) * 15;
    return {
      profiles: profiles,
      startTxt: fmt(s.start),
      endTxt: fmt(s.end),
      durTxt: dh + ' h' + (dm ? ' ' + dm + ' min' : ''),
      barLeft: (s.start / 96 * 100).toFixed(3) + '%',
      barWidth: (dur / 96 * 100).toFixed(3) + '%',
      barColor: current.color,
      startDown: function () { self.setState({ start: Math.max(0, s.start - 1) }); },
      startUp: function () { self.setState({ start: Math.min(s.end - 1, s.start + 1) }); },
      endDown: function () { self.setState({ end: Math.max(s.start + 1, s.end - 1) }); },
      endUp: function () { self.setState({ end: Math.min(96, s.end + 1) }); }
    };
  }
}
</script>
</body>
</html>
